# Production deployment for justacamera.app (nginx).
# Serves the static Vite build (dist/) over HTTPS with a strict security-header
# policy. Keep directives in sync with config/security-headers.ts —
# tests/unit/security/security-headers.spec.ts asserts the required tokens here.
#
# NOTE: a location-level `add_header` REPLACES inherited server-level headers in
# nginx, so the security headers are repeated in the /assets/ block.

server {
    listen 443 ssl;
    http2 on;
    server_name justacamera.app;

    ssl_certificate     /etc/ssl/justacamera/fullchain.pem;
    ssl_certificate_key /etc/ssl/justacamera/privkey.pem;

    root /srv/justacamera/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server_tokens off;

    # --- Security headers (server scope; `always` sends them on errors too) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), geolocation=(), browsing-topics=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Long-cache content-hashed assets. A location-level add_header REPLACES all
    # inherited add_header directives, so EVERY security header is re-declared
    # here (not just CSP) to avoid weakening protection on JS/CSS responses.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self), geolocation=(), browsing-topics=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), midi=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA history-mode fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Canonical host: 301 www → apex (HTTPS) so all link equity folds into one URL
# (reinforces <link rel="canonical">). Requires the cert to cover www.
server {
    listen 443 ssl;
    http2 on;
    server_name www.justacamera.app;

    ssl_certificate     /etc/ssl/justacamera/fullchain.pem;
    ssl_certificate_key /etc/ssl/justacamera/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    return 301 https://justacamera.app$request_uri;
}

# Redirect HTTP (apex or www) → canonical HTTPS apex in a single hop.
server {
    listen 80;
    server_name justacamera.app www.justacamera.app;
    return 301 https://justacamera.app$request_uri;
}
